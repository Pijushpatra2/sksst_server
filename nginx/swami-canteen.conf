# ══════════════════════════════════════════════════════════════════════════════
# NGINX Configuration — Swami Canteen POS
# File: /etc/nginx/sites-available/swami-canteen.conf
#
# Purpose:
#   1. Load-balance API requests across PM2 cluster instances on ports 5001–5004
#   2. Reverse-proxy Next.js frontend on port 3000
#   3. Set security headers
#   4. Enable gzip compression
#   5. Long-lived cache headers for static assets
#
# DEPLOYMENT:
#   sudo ln -s /etc/nginx/sites-available/swami-canteen.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ══════════════════════════════════════════════════════════════════════════════

# ─── API Server Upstream Pool ──────────────────────────────────────────────────
# PM2 runs the Express API in cluster mode.
# Add one 'server' line per CPU core / PM2 instance.
# least_conn distributes to the instance with fewest active connections.

upstream canteen_api {
    least_conn;
    server 127.0.0.1:5001;
    server 127.0.0.1:5002;
    server 127.0.0.1:5003;
    server 127.0.0.1:5004;

    # Health check — mark server down after 2 fails, retry after 10s
    keepalive 64;
}

# ─── Gzip Compression ─────────────────────────────────────────────────────────

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    image/svg+xml;

# ─── Rate Limiting Zone ────────────────────────────────────────────────────────
# Limit each IP to 30 API requests per second (burst 60)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# ══════════════════════════════════════════════════════════════════════════════
# Server Block — HTTP (redirect to HTTPS in production)
# ══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name localhost canteen.local;

    # ── Redirect all HTTP → HTTPS in production ───────────────────────────────
    # Uncomment when SSL is configured:
    # return 301 https://$host$request_uri;

    # ── For development / local network: serve directly on HTTP ───────────────

    # ─── API Route — forward to Express backend cluster ───────────────────────
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass         http://canteen_api;
        proxy_http_version 1.1;

        # WebSocket / keep-alive headers
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;

        # Disable buffering for streaming responses (SSE / progress)
        proxy_buffering off;

        # CORS — allow the Next.js frontend origin
        add_header Access-Control-Allow-Origin  "http://localhost:3000" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ─── Next.js Frontend ─────────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade         $http_upgrade;
        proxy_set_header   Connection      "upgrade";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ─── Static Assets — aggressive cache (Next.js /_next/static/) ───────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ─── Security Headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}

# ══════════════════════════════════════════════════════════════════════════════
# Server Block — HTTPS (enable in production with SSL certificates)
# ══════════════════════════════════════════════════════════════════════════════

